<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerMath Defenders - Cosmic Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
        @keyframes shoot {
            0% { transform: translateX(0) translateY(0); opacity: 1; }
            100% { transform: translateX(300px) translateY(300px); opacity: 0; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite;
        }
        
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 10s ease-in-out infinite;
        }
        
        .planet {
            position: absolute;
            border-radius: 50%;
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }
        
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            animation: shoot 3s linear infinite;
        }
        
        .character {
            animation: bounce 2s ease-in-out infinite;
        }
        
        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.8));
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }
        
        .spin-slow {
            animation: spin 3s linear infinite;
        }
        
        .pulse-correct {
            animation: pulse-scale 0.5s;
        }
        
        .shake-wrong {
            animation: shake 0.5s;
        }
        
        input[type="text"]:focus {
            outline: none;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.8);
        }
    </style>
</head>
<body class="overflow-x-hidden">
    <!-- Animated Cosmic Background -->
    <div class="fixed inset-0 bg-gradient-to-b from-indigo-950 via-purple-900 to-violet-950 -z-10 overflow-hidden">
        <!-- Nebula clouds -->
        <div class="nebula w-96 h-96 bg-purple-600 top-[10%] left-[10%]"></div>
        <div class="nebula w-80 h-80 bg-blue-600 bottom-[10%] right-[10%]" style="animation-delay: 2s;"></div>
        <div class="nebula w-72 h-72 bg-pink-600 top-[50%] left-[50%]" style="animation-delay: 4s;"></div>
        
        <!-- Planets -->
        <div class="planet w-20 h-20 bg-gradient-to-br from-orange-400 to-red-600 top-12 right-20"></div>
        <div class="planet w-32 h-32 bg-gradient-to-br from-blue-400 to-purple-600 bottom-24 left-16" style="animation-delay: 1.5s;"></div>
        
        <!-- Shooting stars -->
        <div class="shooting-star top-[20%] left-[20%]"></div>
        <div class="shooting-star top-[30%] right-[30%]" style="animation-delay: 3s;"></div>
        
        <!-- Stars container -->
        <div id="starsContainer" class="absolute inset-0"></div>
    </div>

    <!-- Home Screen -->
    <div id="homeScreen" class="min-h-screen flex items-center justify-center p-4 md:p-6">
        <div class="max-w-md w-full">
            <!-- Logo -->
            <div class="text-center mb-12 relative">
                <div class="absolute inset-0 blur-2xl opacity-50">
                    <h1 class="text-5xl md:text-6xl font-black bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 text-transparent">
                        POWERMATH
                    </h1>
                </div>
                <h1 class="relative text-5xl md:text-6xl font-black mb-2 bg-gradient-to-r from-yellow-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent logo-glow">
                    POWERMATH
                </h1>
                <h2 class="text-3xl md:text-4xl font-black bg-gradient-to-r from-orange-400 to-orange-600 bg-clip-text text-transparent">
                    DEFENDERS
                </h2>
                <div class="absolute -top-6 right-[20%] text-3xl spin-slow">✨</div>
            </div>

            <!-- Characters -->
            <div class="flex justify-center gap-3 md:gap-4 mb-16 flex-wrap">
                <div class="character w-16 h-20 md:w-20 md:h-24 bg-gradient-to-b from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl cursor-pointer hover:scale-110 transition-transform" style="animation-delay: 0s;">
                    <span class="text-3xl md:text-4xl">🦸</span>
                </div>
                <div class="character w-16 h-20 md:w-20 md:h-24 bg-gradient-to-b from-green-400 to-green-600 rounded-2xl flex items-center justify-center shadow-2xl cursor-pointer hover:scale-110 transition-transform" style="animation-delay: 0.2s;">
                    <span class="text-3xl md:text-4xl">🧙</span>
                </div>
                <div class="character w-16 h-20 md:w-20 md:h-24 bg-gradient-to-b from-red-400 to-red-600 rounded-2xl flex items-center justify-center shadow-2xl cursor-pointer hover:scale-110 transition-transform" style="animation-delay: 0.4s;">
                    <span class="text-3xl md:text-4xl">🤖</span>
                </div>
                <div class="character w-16 h-20 md:w-20 md:h-24 bg-gradient-to-b from-yellow-400 to-yellow-600 rounded-2xl flex items-center justify-center shadow-2xl cursor-pointer hover:scale-110 transition-transform" style="animation-delay: 0.6s;">
                    <span class="text-3xl md:text-4xl">👾</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="space-y-4">
                <button onclick="showScreen('registerScreen')" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all text-lg">
                    Login
                </button>
                <button onclick="showScreen('registerScreen')" class="w-full bg-gradient-to-r from-orange-400 to-red-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all text-lg">
                    Registration
                </button>
                <button onclick="showScreen('registerScreen')" class="w-full bg-gradient-to-r from-purple-400 to-pink-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all text-lg">
                    Parent Login
                </button>
            </div>
        </div>
    </div>

    <!-- Registration Screen -->
    <div id="registerScreen" class="hidden min-h-screen flex items-center justify-center p-4 md:p-6">
        <div class="max-w-md w-full relative">
            <button onclick="showScreen('homeScreen')" class="absolute -top-4 left-0 bg-white/10 backdrop-blur-lg border border-white/20 text-white text-2xl w-12 h-12 rounded-xl hover:bg-white/20 transition-all hover:scale-110">
                ←
            </button>
            
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 md:p-10 shadow-2xl mt-12">
                <h2 class="text-white text-2xl md:text-3xl font-bold text-center mb-8">Enter Your Name</h2>
                
                <div class="flex justify-center mb-8">
                    <div class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center shadow-2xl">
                        <span class="text-5xl md:text-6xl">👤</span>
                    </div>
                </div>
                
                <input type="text" id="userName" placeholder="Hero Name" maxlength="20" 
                    class="w-full bg-white/10 backdrop-blur-lg border-2 border-white/30 text-white placeholder-white/60 rounded-full py-4 px-6 mb-6 text-lg focus:border-yellow-400 focus:bg-white/20 transition-all">
                
                <button onclick="startGame()" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all text-lg">
                    Start Adventure 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Levels Screen -->
    <div id="levelsScreen" class="hidden min-h-screen p-4 md:p-6">
        <div class="max-w-md mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <button onclick="showScreen('homeScreen')" class="bg-white/10 backdrop-blur-lg border border-white/20 text-white text-xl w-12 h-12 rounded-xl hover:bg-white/20 transition-all hover:scale-110 flex items-center justify-center">
                    ←
                </button>
                <h2 class="text-white text-xl md:text-2xl font-bold">Math Mission</h2>
                <button onclick="showScreen('leaderboardScreen')" class="bg-white/10 backdrop-blur-lg border border-white/20 text-2xl w-12 h-12 rounded-xl hover:bg-white/20 transition-all hover:scale-110 flex items-center justify-center">
                    🏆
                </button>
            </div>

            <!-- Levels Path -->
            <div class="relative py-10">
                <div class="absolute left-1/2 top-0 bottom-0 w-1 bg-white/20 -translate-x-1/2"></div>
                
                <div id="levelsContainer" class="space-y-16">
                    <!-- Levels will be inserted here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="hidden min-h-screen p-4 md:p-6">
        <div class="max-w-md mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <button onclick="showScreen('levelsScreen')" class="bg-white/10 backdrop-blur-lg border border-white/20 text-white text-xl w-12 h-12 rounded-xl hover:bg-white/20 transition-all hover:scale-110 flex items-center justify-center">
                    ←
                </button>
                <div class="bg-white/10 backdrop-blur-lg border border-white/20 text-white font-bold text-lg px-5 py-2 rounded-full">
                    Score: <span id="scoreValue">0</span>
                </div>
                <div class="text-white font-bold text-lg">
                    <span id="currentQuestion">1</span>/12
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-3 bg-white/20 rounded-full overflow-hidden mb-8">
                <div id="progressBar" class="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full transition-all duration-500" style="width: 8.33%"></div>
            </div>

            <!-- Question Type Badge -->
            <div class="flex justify-center mb-4">
                <span id="questionTypeBadge" class="bg-purple-500/30 backdrop-blur-lg border border-purple-400/50 text-purple-200 px-4 py-1 rounded-full text-sm font-semibold">
                    Multiple Choice
                </span>
            </div>

            <!-- Quiz Card -->
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 md:p-8 mb-6 shadow-2xl">
                <h3 id="quizLevelName" class="text-white text-lg md:text-xl font-bold mb-4">TECH JUNGLE</h3>
                <p id="questionText" class="text-yellow-300 text-2xl md:text-3xl font-bold mb-8">What is 15 + 27?</p>

                <!-- Multiple Choice / True False Container -->
                <div id="optionsContainer" class="space-y-4">
                    <!-- Options will be inserted here -->
                </div>

                <!-- Fill in the Blank Container -->
                <div id="fillBlankContainer" class="hidden space-y-4">
                    <input type="text" id="fillBlankInput" placeholder="Enter your answer" 
                        class="w-full bg-white/20 backdrop-blur-lg border-2 border-white/30 text-white text-xl placeholder-white/60 rounded-2xl py-4 px-6 focus:border-yellow-400 focus:bg-white/30 transition-all text-center font-bold">
                    <button onclick="submitFillBlank()" class="w-full bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all">
                        Submit Answer
                    </button>
                </div>
            </div>

            <!-- Try Again Button -->
            <button id="tryAgainBtn" onclick="resetQuiz()" class="hidden w-full bg-gradient-to-r from-orange-400 to-red-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all">
                Try Again
            </button>
        </div>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboardScreen" class="hidden min-h-screen p-4 md:p-6">
        <div class="max-w-md mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <button onclick="showScreen('levelsScreen')" class="bg-white/10 backdrop-blur-lg border border-white/20 text-white text-xl w-12 h-12 rounded-xl hover:bg-white/20 transition-all hover:scale-110 flex items-center justify-center">
                    ←
                </button>
                <h2 class="text-white text-xl md:text-2xl font-bold">Leaderboard</h2>
                <div class="w-12"></div>
            </div>

            <!-- Score Card -->
            <div class="bg-gradient-to-br from-yellow-400 to-orange-500 rounded-3xl p-8 text-center mb-8 shadow-2xl">
                <div class="text-5xl mb-3">👑</div>
                <h3 class="text-white text-xl font-bold mb-2">Your Score</h3>
                <p id="finalScore" class="text-white text-6xl font-black">0</p>
            </div>

            <!-- Tabs -->
            <div class="flex gap-4 mb-6">
                <button class="flex-1 bg-gradient-to-r from-orange-400 to-red-500 text-white font-bold py-3 rounded-full shadow-lg">
                    This Week
                </button>
                <button class="flex-1 bg-white/20 backdrop-blur-lg border border-white/20 text-white font-bold py-3 rounded-full hover:bg-white/30 transition-all">
                    All Time
                </button>
            </div>

            <!-- Leaderboard List -->
            <div id="leaderboardList" class="space-y-4 mb-8">
                <!-- Leaderboard items will be inserted here -->
            </div>

            <!-- Play Again Button -->
            <button onclick="resetQuiz()" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold py-4 px-6 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all text-lg">
                Play Again 🎮
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
